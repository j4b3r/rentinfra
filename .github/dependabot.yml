version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  # The CI workflows' own actions (checkout, setup-node, codeql-action) are a
  # dependency surface too, now that they exist.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
